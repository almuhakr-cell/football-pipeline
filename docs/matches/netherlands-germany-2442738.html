
<!doctype html>

<html lang="de">

<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>
Netherlands – Germany | Match-Hub
</title>

<meta name="description"
content="Netherlands – Germany – Match-Hub mit Countdown und Fan-Challenge.">

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    color: #111827;
}

header {
    background: #111827;
    color: white;
    padding: 18px;
}

header a {
    color: white;
    text-decoration: none;
}

main {
    max-width: 900px;
    margin: auto;
    padding: 16px;
}

.card {
    background: white;
    border-radius: 20px;
    padding: 22px;
    margin-bottom: 16px;
    box-shadow: 0 4px 18px rgba(0,0,0,.06);
}

.teams {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    text-align: center;
    gap: 15px;
}

.team {
    font-size: 25px;
    font-weight: 800;
}

.vs {
    color: #6b7280;
    font-weight: 800;
}

.countdown {
    text-align: center;
    font-size: 30px;
    font-weight: 800;
    margin: 22px 0;
}

.meta {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 10px;
}

.meta div {
    background: #f8fafc;
    padding: 14px;
    border-radius: 14px;
}

.label {
    color: #6b7280;
    font-size: 13px;
}

.value {
    font-weight: 700;
    margin-top: 5px;
}

.predictions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.prediction {
    padding: 16px;
    border: 2px solid #e5e7eb;
    border-radius: 16px;
    background: white;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
}

.prediction.selected {
    border-color: #111827;
    background: #f3f4f6;
}

.result {
    text-align: center;
    margin-top: 14px;
    font-weight: 700;
}

.share {
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 14px;
    background: #111827;
    color: white;
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
}

.muted {
    color: #6b7280;
}

@media(max-width:650px) {

    .teams {
        grid-template-columns: 1fr;
    }

    .vs {
        display: none;
    }

    .meta {
        grid-template-columns: 1fr;
    }

}

</style>

</head>

<body>

<header>

<a href="../">
← مركز مباريات ألمانيا
</a>

</header>

<main>

<section class="card">

<div class="teams">

<div class="team">
Netherlands
</div>

<div class="vs">
VS
</div>

<div class="team">
Germany
</div>

</div>

<div
id="countdown"
class="countdown"
data-time="1790275500000">
جاري حساب الوقت...
</div>

<div class="meta">

<div>

<div class="label">
التاريخ والوقت
</div>

<div class="value">
24.09.2026 · 18:45
</div>

</div>

<div>

<div class="label">
المسابقة
</div>

<div class="value">
UEFA Nations League
</div>

</div>

<div>

<div class="label">
المكان
</div>

<div class="value">
Spielort folgt
</div>

</div>

</div>

</section>


<section class="card">

<h2>
🔥 تحدي المباراة
</h2>

<p class="muted">
اختر توقعك. سيتم حفظ اختيارك على جهازك.
</p>

<div class="predictions">

<button
class="prediction"
data-choice="home">
Netherlands
</button>

<button
class="prediction"
data-choice="away">
Germany
</button>

</div>

<div
id="prediction-result"
class="result">
</div>

</section>


<section class="card">

<h2>
📊 مركز المباراة
</h2>

<p class="muted">
الإحصائيات والأخبار ستظهر هنا عندما تتوفر
من مصادر بيانات موثوقة.
</p>

</section>


<section class="card">

<button
class="share"
onclick="shareMatch()">
📤 مشاركة المباراة
</button>

</section>

</main>


<script>

const countdown =
document.getElementById("countdown");

const target =
Number(countdown.dataset.time);

function updateCountdown() {

    if (!target) {
        countdown.textContent =
            "موعد المباراة غير متوفر";
        return;
    }

    const now =
        Date.now();

    let diff =
        target - now;

    if (diff <= 0) {
        countdown.textContent =
            "🔥 المباراة بدأت";
        return;
    }

    const days =
        Math.floor(
            diff / 86400000
        );

    diff %= 86400000;

    const hours =
        Math.floor(
            diff / 3600000
        );

    diff %= 3600000;

    const minutes =
        Math.floor(
            diff / 60000
        );

    const seconds =
        Math.floor(
            (diff % 60000) / 1000
        );

    countdown.textContent =
        days + " يوم · " +
        hours + " ساعة · " +
        minutes + " دقيقة · " +
        seconds + " ثانية";
}

updateCountdown();

setInterval(
    updateCountdown,
    1000
);


const buttons =
    document.querySelectorAll(
        ".prediction"
    );

const result =
    document.getElementById(
        "prediction-result"
    );

const storageKey =
    "prediction-2442738";

const saved =
    localStorage.getItem(
        storageKey
    );

if (saved) {
    selectPrediction(saved);
}

buttons.forEach(button => {

    button.addEventListener(
        "click",
        () => {

            const choice =
                button.dataset.choice;

            localStorage.setItem(
                storageKey,
                choice
            );

            selectPrediction(
                choice
            );
        }
    );

});


function selectPrediction(choice) {

    buttons.forEach(button => {

        button.classList.toggle(
            "selected",
            button.dataset.choice === choice
        );

    });

    if (choice === "home") {
        result.textContent =
            "تم حفظ توقعك: " +
            "Netherlands";
    } else {
        result.textContent =
            "تم حفظ توقعك: " +
            "Germany";
    }
}


async function shareMatch() {

    const shareData = {
        title:
            "Netherlands – Germany",
        text:
            "🔥 تحدي مباراة Netherlands – Germany",
        url:
            window.location.href
    };

    try {

        if (
            navigator.share
        ) {

            await navigator.share(
                shareData
            );

        } else {

            await navigator.clipboard.writeText(
                window.location.href
            );

            alert(
                "تم نسخ رابط المباراة"
            );
        }

    } catch (error) {}
}

</script>

</body>

</html>
